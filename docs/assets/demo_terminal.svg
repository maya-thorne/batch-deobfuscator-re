      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 0.9s infinite; }
    .step1 { animation: typing 8s infinite 0s; }
    .step2 { animation: typing 8s infinite 1.8s; }
    .step3 { animation: typing 8s infinite 3.5s; }
    .step4 { animation: typing 8s infinite 5.2s; }
  </style>

  <!-- Window Frame -->
  <rect width="920" height="400" rx="12" fill="url(#termBg)"/>
  <rect x="1" y="1" width="918" height="398" rx="11" fill="none" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Titlebar -->
