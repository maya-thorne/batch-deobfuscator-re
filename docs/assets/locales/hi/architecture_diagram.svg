<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1328"/>
      <stop offset="100%" stop-color="#070a16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="390" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="998" height="388" rx="13" fill="none" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Title Header Bar -->
  <text x="500" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle" filter="url(#glow)">
    Ghidra MCP PE बाइनरी रिवर्स इंजीनियरिंग और मल्टी-पास AST डी-ओबफस्केटर पाइपलाइन
  </text>

  <!-- 4 Cards -->
  
    <!-- Card at 24 -->
    <g transform="translate(24, 60)">
      <rect width="226" height="300" rx="10" fill="#090e1c" stroke="#0284c7" stroke-width="1.4"/>
      <rect width="226" height="38" rx="10" fill="#0e2238"/>
      <rect y="26" width="226" height="12" fill="#0e2238"/>
      <circle cx="16" cy="19" r="4.5" fill="#7dd3fc" filter="url(#glow)"/>
      <text x="28" y="23" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="0.3">1. ओबफस्केटेड स्क्रिप्ट और PE इनपुट</text>
      <line x1="0" y1="38" x2="226" y2="38" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
      
      <text x="12" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• रॉ बैच पेलोड (.bat/.cmd)</text>
      <text x="22" y="72" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">कैरेट (^), BOM और सीज़र सिफर</text>
      
      <text x="12" y="102" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• संकलित PE निष्पादन योग्य फाइलें</text>
      <text x="22" y="118" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">UPX, LZMA और XOR स्टब्स</text>
      
    </g>
  
    <!-- Card at 266 -->
    <g transform="translate(266, 60)">
      <rect width="226" height="300" rx="10" fill="#090e1c" stroke="#059669" stroke-width="1.4"/>
      <rect width="226" height="38" rx="10" fill="#0b2921"/>
      <rect y="26" width="226" height="12" fill="#0b2921"/>
      <circle cx="16" cy="19" r="4.5" fill="#6ee7b7" filter="url(#glow)"/>
      <text x="28" y="23" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="0.3">2. GHIDRA MCP फोरेंसिक</text>
      <line x1="0" y1="38" x2="226" y2="38" stroke="#059669" stroke-width="1" stroke-opacity="0.4"/>
      
      <text x="12" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• bat2exe_12.exe डिसअसेंबली</text>
      <text x="22" y="72" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">RVA 0x20ea0 पर UPX लूप</text>
      
      <text x="12" y="102" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• example.exe CLR निष्कर्षण</text>
      <text x="22" y="118" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">ऑफसेट 0x9f78 पर Bytepress LZMA</text>
      
      <text x="12" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• xorStub.exe ओवरले विश्लेषण</text>
      <text x="22" y="164" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">ओवरले "***" और "randomkey"</text>
      
    </g>
  
    <!-- Card at 508 -->
    <g transform="translate(508, 60)">
      <rect width="226" height="300" rx="10" fill="#090e1c" stroke="#7e22ce" stroke-width="1.4"/>
      <rect width="226" height="38" rx="10" fill="#25123d"/>
      <rect y="26" width="226" height="12" fill="#25123d"/>
      <circle cx="16" cy="19" r="4.5" fill="#d8b4fe" filter="url(#glow)"/>
      <text x="28" y="23" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="0.3">3. फिक्स्ड-पॉइंट AST इंजन</text>
      <line x1="0" y1="38" x2="226" y2="38" stroke="#7e22ce" stroke-width="1" stroke-opacity="0.4"/>
      
      <text x="12" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• पास 1: UTF-16LE BOM स्ट्रिप</text>
      <text x="22" y="72" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">BOM डिटेक्शन और सर्टिफिकेट</text>
      
      <text x="12" y="102" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• पास 2: कैरेट (^) सामान्यीकरण</text>
      <text x="22" y="118" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">^ हटाना और "" को संक्षिप्त करना</text>
      
      <text x="12" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• पास 3: SET सिंबल टेबल ट्रैकिंग</text>
      <text x="22" y="164" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">डायनामिक वेरिएबल रेजोल्यूशन</text>
      
      <text x="12" y="194" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• पास 4: फिक्स्ड-पॉइंट लूप</text>
      <text x="22" y="210" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">अभिसरण: fp_prev == fp_curr</text>
      
    </g>
  
    <!-- Card at 750 -->
    <g transform="translate(750, 60)">
      <rect width="226" height="300" rx="10" fill="#090e1c" stroke="#d97706" stroke-width="1.4"/>
      <rect width="226" height="38" rx="10" fill="#361b0c"/>
      <rect y="26" width="226" height="12" fill="#361b0c"/>
      <circle cx="16" cy="19" r="4.5" fill="#fde68a" filter="url(#glow)"/>
      <text x="28" y="23" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="0.3">4. EDR रक्षा और SIEM नियम</text>
      <line x1="0" y1="38" x2="226" y2="38" stroke="#d97706" stroke-width="1" stroke-opacity="0.4"/>
      
      <text x="12" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• cmd.exe!FindFixAndRun हुक</text>
      <text x="22" y="72" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">रनटाइम API डेटूर (RVA 0x116B0)</text>
      
      <text x="12" y="102" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• प्रोडक्शन सिग्मा डिटेक्शन रूल्स</text>
      <text x="22" y="118" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">sigma_batch_obfuscation.yml</text>
      
      <text x="12" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-rendering="geometricPrecision">• प्रोडक्शन YARA हस्ताक्षर</text>
      <text x="22" y="164" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" text-rendering="geometricPrecision">yara_batch_obfuscation.yar</text>
      
    </g>

  <!-- Connecting Arrows -->
  <path d="M 250 210 L 264 210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 492 210 L 506 210" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 734 210 L 748 210" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subtle Footer Line -->
  <text x="500" y="378" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="10" text-anchor="middle">
    Maya Thorne · Advanced Systems &amp; Reverse Engineering Architecture · Zero-Overflow Typography Invariant
  </text>
</svg>